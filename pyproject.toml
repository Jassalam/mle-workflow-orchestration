[project]
name = "mle-workflow-orchestration"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "dbt-postgres>=1.11.0",
    "pandas>=3.0.5",
    "prefect>=3.8.5",
    "prefect-dbt>=0.7.25",
    "prefect-sqlalchemy>=0.6.1",
    "pyarrow>=25.0.1",
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]

[tool.rumdl]
disable = ["MD013"]

[tool.rumdl.MD033]
allowed-elements = ["img"]
